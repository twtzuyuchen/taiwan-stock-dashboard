scoring:
  # 綜合評分權重（總和建議 = 1.0）
  weights:
    chip_cleanliness: 0.25      # 籌碼乾淨度
    institutional_position: 0.30 # 主力布局分數
    technical_trend: 0.20       # 技術趨勢
    fundamental: 0.25           # 基本面催化
  thresholds:
    green: 70   # 分數 >= 70 顯示綠燈
    yellow: 40  # 40~69 顯示黃燈，< 40 顯示紅燈

  # 籌碼乾淨度細項設定（可省略，省略時採用下列預設值）
  # 三個子項分數缺資料時會自動略過並重新分配權重，三者皆缺才會回傳中性分數 50
  chip_cleanliness_detail:
    weights:
      margin_momentum: 0.45      # 融資餘額動能（近 N 日融資餘額變化）
      margin_utilization: 0.25   # 融資使用率（融資餘額 / 融資限額）
      holder_concentration: 0.30 # 大戶持股集中度趨勢（集保股權分散表）
    # 融資使用率：<= safe 滿分；>= danger 0 分；中間線性內插
    utilization_safe: 0.5
    utilization_danger: 0.9
    # 大戶門檻：持股張數下限（股數），400000 股 = 400 張
    big_holder_min_shares: 400000
    # 大戶集中度比較最近幾次集保股權分散表（每週更新，4 次約等於近一個月）
    holder_lookback_snapshots: 4

  # 主力建倉訊號（悄悄吸籌）細項設定，可省略，省略時採用下列預設值
  # 三個條件同時成立才會觸發：買超天數比例夠高、買超力道加速、股價尚未大幅表態
  accumulation_detail:
    # 第一層：法人籌碼面（必要條件，三者同時成立才算過關）
    buy_ratio_threshold: 0.7    # 近N個交易日中，買超天數至少要佔這個比例
    price_change_cap_pct: 15    # 同期股價漲幅超過這個百分比，視為已被市場表態，不算悄悄建倉
    min_days: 5                 # 可比對交易日至少要有這麼多天，才進行判斷
    # 第二層：價量型態佐證（輔助條件，第一層過關後才會檢查；資料不足的項目會自動排除，不硬湊）
    min_pattern_evidence: 2         # 下列三項型態中，至少要有幾項成立才算通過第二層
    volume_spike_multiplier: 1.8    # 「關鍵價位量增不漲」：單日量能達20日均量的幾倍才算放大
    price_flat_threshold_pct: 3     # 「關鍵價位量增不漲」：當天漲跌幅需在這個範圍內才算「不漲」
    near_low_pct: 10                # 「關鍵價位量增不漲」：收盤價需落在期間最低點上方這個百分比內，才算「關鍵價位」
    reversal_recovery_pct: 5        # 「股價強勢破底翻」：創新低後至今反彈幅度要達到這個百分比
    consolidation_recent_days: 5    # 「盤整期量縮至極致」：近幾個交易日視為「近期」
    consolidation_prior_days: 15    # 「盤整期量縮至極致」：近期之前的幾個交易日視為比較基準的「前段」
    consolidation_shrink_ratio: 0.6 # 「盤整期量縮至極致」：近期均量需萎縮到前段均量的這個比例以下
    consolidation_range_cap_pct: 5  # 「盤整期量縮至極致」：近期股價波動幅度需收斂在這個百分比以內

  # 短線（約1-2週）進場提醒細項設定，可省略，省略時採用下列預設值
  # 三個條件同時成立才會觸發：現價貼近近期低點、低檔區出現看漲反轉K線型態（多頭吞噬／槌子線）、
  # 當日價量關係為價漲量增
  short_term_entry_detail:
    low_lookback_days: 10             # 「近期低點」回溯幾個交易日（約2週）
    near_low_pct: 6                   # 現價需落在近期低點上方這個百分比以內，才算「貼近低點」
    pattern_lookback_days: 5          # 看漲反轉K線型態需在近幾個交易日內出現，才算「最近」
    vol_baseline_days: 20             # 計算均量所用的天數
    volume_confirm_multiplier: 1.3    # 當日成交量需達到均量的幾倍，且屬價漲量增，才算量能確認

  # 短線（約1-2週）出場提醒細項設定，可省略，省略時採用下列預設值
  # 停利停損參考價位用 ATR（真實波動幅度）估算，任何時候都會顯示；技術反轉警訊
  # （看跌反轉K線型態或價跌量增）額外標示是否該留意獲利了結或停損
  short_term_exit_detail:
    atr_days: 10                      # ATR 回溯天數
    stop_atr_multiplier: 1.2          # 停損參考價 = 現價 - ATR * 這個倍數
    take_profit_atr_multiplier: 2.0   # 停利參考價 = 現價 + ATR * 這個倍數
    high_lookback_days: 10            # 「近期高點」回溯幾個交易日，判斷是否貼近高檔
    near_high_pct: 6                  # 現價需落在近期高點下方這個百分比以內，才算「貼近高點」
    pattern_lookback_days: 5          # 看跌反轉K線型態需在近幾個交易日內出現
    vol_baseline_days: 20
    volume_warn_multiplier: 1.3       # 當日成交量需達到均量的幾倍，且屬價跌量增，才視為出貨警訊

  # 波段（約1-2個月）進場提醒細項設定，可省略，省略時採用下列預設值
  # 四個條件同時成立才會觸發：中期均線多頭排列（波段格局偏多）、股價拉回至近期低點、
  # 拉回過程中出現看漲反轉K線型態、當日價量關係為價漲量增
  swing_entry_detail:
    trend_ma_fast: 20                 # 中期趨勢過濾用的快均線天數
    trend_ma_slow: 60                 # 中期趨勢過濾用的慢均線天數
    pullback_lookback_days: 20        # 「近期低點」回溯幾個交易日（約1個月）
    near_low_pct: 8                   # 現價需落在近期低點上方這個百分比以內，才算「拉回到位」
    pattern_lookback_days: 10         # 看漲反轉K線型態需在近幾個交易日內出現
    vol_baseline_days: 20
    volume_confirm_multiplier: 1.3

  # 波段（約1-2個月）出場提醒細項設定，可省略，省略時採用下列預設值
  # 邏輯與短線出場提醒相同，但 ATR 回溯天數與倍數都放寬，並額外加入中期均線死亡交叉
  # 作為波段專屬的技術反轉警訊
  swing_exit_detail:
    atr_days: 20                      # ATR 回溯天數（約1個月）
    stop_atr_multiplier: 2.0          # 停損參考價 = 現價 - ATR * 這個倍數
    take_profit_atr_multiplier: 3.5   # 停利參考價 = 現價 + ATR * 這個倍數
    high_lookback_days: 20            # 「近期高點」回溯幾個交易日
    near_high_pct: 8
    pattern_lookback_days: 10
    vol_baseline_days: 20
    volume_warn_multiplier: 1.3
    trend_ma_fast: 20                 # 中期均線死亡交叉判斷用的快均線天數
    trend_ma_slow: 60                 # 中期均線死亡交叉判斷用的慢均線天數

output:
  dashboard_dir: "output"
  # 是否同時輸出 GitHub Pages 用的 docs/index.html
  publish_github_pages: true
  github_pages_dir: "docs"
  # 買賣訊號需要跨日比較（評分區間轉換），狀態存在這個資料夾，
  # 必須跟 docs/ 一樣被 git commit，下次執行才讀得到「昨天」的結果
  state_dir: "state"
