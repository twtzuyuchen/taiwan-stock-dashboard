    business_summary: "全球高密度互連板（HDI）龍頭廠商，產品涵蓋HDI硬板、軟板（FPC）及硬軟結合板，應用橫跨智慧型手機、低軌衛星通訊、AI伺服器與光模組等領域，近年積極擴大低軌衛星與AI伺服器相關產能。"
    us_relation: "根據Apple官方供應商名單，華通為蘋果（Apple）認證供應商之一，供應iPhone用HDI主板及軟板（FPC）；另市場與媒體報導稱其為SpaceX Starlink衛星HDI板主要／獨家供應商，惟此關係未經SpaceX官方證實，屬供應鏈推估，應予以合理保留。"
  - stock_id: "6285"
    name: "啟碁"
    risk_preference: "穩健"
    holding: true
